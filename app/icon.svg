<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <style>
    :root {
      --bg: #09090b;
      --border: #27272a;
      --fg: #f4f4f5;
      --iris: #34d399;
      --glow: rgba(52, 211, 153, 0.4);
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #ffffff;
        --border: #e4e4e7;
        --fg: #09090b;
        --iris: #059669;
        --glow: rgba(5, 150, 105, 0.25);
      }
    }
    .canvas-bg {
      fill: var(--bg);
      stroke: var(--border);
      stroke-width: 1.5;
    }
    .eye-stroke {
      stroke: var(--fg);
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .iris-glow {
      fill: var(--iris);
    }
    .iris-core {
      fill: var(--iris);
    }
  </style>

  <!-- Base Canvas Squircle -->
  <rect x="1" y="1" width="30" height="30" rx="7" class="canvas-bg" />

  <!-- Left Eye: Open & Expressive with Glowing Emerald Iris -->
  <!-- Upper & Lower Lids -->
  <path d="M 5 15 Q 11 8 17 15 Q 11 22 5 15 Z" class="eye-stroke" stroke-width="1.8" fill="none" />
  
  <!-- Outer Pulse Halo -->
  <circle cx="11" cy="15" r="4" class="iris-glow" opacity="0.3">
    <animate attributeName="r" values="3.2;5;3.2" dur="2.5s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.45;0.08;0.45" dur="2.5s" repeatCount="indefinite" />
  </circle>

  <!-- Pulsing Emerald Pupil/Iris -->
  <circle cx="11" cy="15" r="2.6" class="iris-core">
    <animate attributeName="opacity" values="1;0.45;1" dur="2.5s" repeatCount="indefinite" />
  </circle>

  <!-- Right Eye: Playful Winking Arc ;) -->
  <path d="M 19 16.5 Q 24 10.5 28 16.5" class="eye-stroke" stroke-width="2.4" fill="none" />
  <path d="M 27.5 17.5 L 29 19.5" class="eye-stroke" stroke-width="1.8" fill="none" />

  <!-- Subtle Cheerful Smile -->
  <path d="M 12 23.5 Q 18 27.5 24 23.5" class="eye-stroke" stroke-width="1.8" fill="none" />
</svg>
