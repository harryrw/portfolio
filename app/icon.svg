<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="emGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#10b981" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Container Squircle -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.5" />

  <!-- Monogram HRW Group -->
  <g filter="url(#glow)">
    <!-- H: Left upright -->
    <rect x="12" y="16" width="5" height="32" rx="2.5" fill="url(#emGrad)" />
    
    <!-- H: Crossbar linking to center stem -->
    <rect x="12" y="30" width="16" height="4.5" rx="2" fill="url(#emGrad)" />

    <!-- H / R: Shared Center Upright -->
    <rect x="24" y="16" width="5" height="32" rx="2.5" fill="url(#emGrad)" />

    <!-- R: Upper Bowl -->
    <path d="M 27 16 C 36 16, 42 19, 42 25 C 42 31, 36 34, 27 34" 
          stroke="url(#emGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- R Leg transitioning into W first apex -->
    <path d="M 33 33 L 42 48" 
          stroke="url(#emGrad)" stroke-width="4.5" stroke-linecap="round" />

    <!-- W: Intersecting Right Wing and Central Valley -->
    <path d="M 39 48 L 47 28 L 52 48" 
          stroke="url(#emGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>
</svg>
