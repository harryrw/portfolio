<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <style>
    :root {
      --bg: #09090b;
      --border: #27272a;
      --fg: #f4f4f5;
      --dot: #34d399;
      --glow: rgba(52, 211, 153, 0.35);
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #ffffff;
        --border: #e4e4e7;
        --fg: #09090b;
        --dot: #059669;
        --glow: rgba(5, 150, 105, 0.25);
      }
    }
    .canvas-bg {
      fill: var(--bg);
      stroke: var(--border);
      stroke-width: 1.5;
    }
    .tilde-char {
      fill: var(--fg);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 19px;
      font-weight: 700;
      text-anchor: middle;
      dominant-baseline: central;
    }
    .status-dot {
      fill: var(--dot);
    }
    .status-halo {
      fill: var(--dot);
    }
  </style>

  <!-- Base Canvas Squircle -->
  <rect x="1" y="1" width="30" height="30" rx="7" class="canvas-bg" />

  <!-- Terminal Tilde `~` -->
  <text x="12" y="15" class="tilde-char">~</text>

  <!-- Pulse-Animated Online Telemetry Dot -->
  <!-- Outer Glow Halo -->
  <circle cx="23" cy="16" r="4" class="status-halo" opacity="0.3">
    <animate attributeName="r" values="3.5;5.5;3.5" dur="2.5s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.45;0.08;0.45" dur="2.5s" repeatCount="indefinite" />
  </circle>

  <!-- Solid Inner Heartbeat Dot -->
  <circle cx="23" cy="16" r="2.8" class="status-dot">
    <animate attributeName="opacity" values="1;0.4;1" dur="2.5s" repeatCount="indefinite" />
  </circle>
</svg>
