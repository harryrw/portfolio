<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="100%" height="100%">
  <defs>
    <clipPath id="squircle">
      <rect width="32" height="32" rx="7" />
    </clipPath>
  </defs>

  <g clip-path="url(#squircle)">
    <!-- High-contrast dark emerald-zinc rounded tile filling 100% of the 32x32 viewport -->
    <rect width="32" height="32" fill="#09090b" />

    <!-- White Throat/Bib at bottom-left for instant contrast -->
    <rect x="0" y="21" width="14" height="11" fill="#ffffff" />
    <rect x="0" y="20" width="14" height="3" fill="#f97316" />

    <!-- Bold Black Toucan Head (Left Side, Full-Bleed) -->
    <path d="M 0 10 Q 0 3 10 3 L 15 3 L 15 21 L 0 21 Z" fill="#18181b" />

    <!-- Giant High-Contrast Eye (Turquoise Ring + White/Dark Pupil) -->
    <circle cx="8.5" cy="11.5" r="4.5" fill="#34d399" />
    <circle cx="8.5" cy="11.5" r="2.4" fill="#09090b" />
    <circle cx="7.7" cy="10.7" r="1.1" fill="#ffffff" />

    <!-- GIANT ICONIC TOUCAN BEAK (Fills Right 60% of Viewport) -->
    <!-- Upper Mandible: Vivid Golden-Orange -->
    <path d="M 14 3 C 23 3, 29 6, 31 15 L 14 15 Z" fill="#fbbf24" />
    <!-- Mid-Beak Emerald Stripe -->
    <path d="M 14 11 L 30 11 C 30.6 13, 31 15, 31 16 L 14 16 Z" fill="#10b981" />
    <!-- Lower Mandible: Deep Emerald -->
    <path d="M 14 16 L 30.5 16 C 29 21, 24 23, 14 23 Z" fill="#059669" />
    <!-- Signature Black Beak Tip -->
    <path d="M 25 6.5 C 28.5 8.5, 30.5 11.5, 31 16 C 30.5 18.5, 29 20.5, 26.5 21.5 L 25 14 Z" fill="#09090b" />
    <!-- Bold Mouth Divider Line -->
    <line x1="14" y1="15.5" x2="30.5" y2="15.5" stroke="#09090b" stroke-width="2" />
  </g>
</svg>
