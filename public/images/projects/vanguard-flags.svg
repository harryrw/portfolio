<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" fill="none">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="55%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#34d399" fill-opacity="0.2" />
    </pattern>
  </defs>

  <rect width="800" height="320" fill="url(#bg2)" />
  <rect width="800" height="320" fill="url(#dots)" />

  <!-- Control Plane Card -->
  <g transform="translate(75, 70)">
    <rect width="270" height="180" rx="16" fill="#18181b" stroke="#34d399" stroke-width="1.5" stroke-opacity="0.7" />
    <text x="24" y="34" fill="#34d399" font-family="ui-monospace, monospace" font-size="12" font-weight="700">FLAG CONTROL PLANE · AST</text>

    <!-- Toggle Row 1 -->
    <rect x="24" y="52" width="222" height="34" rx="8" fill="#09090b" stroke="#27272a" />
    <text x="36" y="73" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="11">edge_stream_v2</text>
    <rect x="194" y="60" width="38" height="18" rx="9" fill="#10b981" />
    <circle cx="223" cy="69" r="6" fill="#ffffff" />

    <!-- Toggle Row 2 -->
    <rect x="24" y="96" width="222" height="34" rx="8" fill="#09090b" stroke="#27272a" />
    <text x="36" y="117" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="11">canary_cohort_25</text>
    <rect x="194" y="104" width="38" height="18" rx="9" fill="#10b981" />
    <circle cx="223" cy="113" r="6" fill="#ffffff" />

    <text x="24" y="156" fill="#a1a1aa" font-family="ui-monospace, monospace" font-size="11">MurmurHash3 · Deterministic</text>
  </g>

  <!-- SSE Broadcast Waves -->
  <path d="M 345 125 C 410 125, 425 95, 490 95" stroke="#34d399" stroke-width="2" stroke-dasharray="5 5" fill="none">
    <animate attributeName="stroke-dashoffset" values="20;0" dur="1.2s" repeatCount="indefinite" />
  </path>
  <path d="M 345 160 L 490 160" stroke="#10b981" stroke-width="2" stroke-dasharray="5 5" fill="none">
    <animate attributeName="stroke-dashoffset" values="20;0" dur="1.2s" repeatCount="indefinite" />
  </path>
  <path d="M 345 195 C 410 195, 425 225, 490 225" stroke="#34d399" stroke-width="2" stroke-dasharray="5 5" fill="none">
    <animate attributeName="stroke-dashoffset" values="20;0" dur="1.2s" repeatCount="indefinite" />
  </path>

  <!-- Edge SDK Nodes -->
  <g transform="translate(490, 65)">
    <rect width="235" height="54" rx="10" fill="#18181b" stroke="#10b981" stroke-width="1.5" />
    <circle cx="24" cy="27" r="5" fill="#34d399">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <text x="40" y="31" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="12" font-weight="600">SSE Edge · SYD-1 (0.4ms)</text>
  </g>
  <g transform="translate(490, 133)">
    <rect width="235" height="54" rx="10" fill="#18181b" stroke="#10b981" stroke-width="1.5" />
    <circle cx="24" cy="27" r="5" fill="#34d399">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <text x="40" y="31" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="12" font-weight="600">SSE Edge · IAD-1 (0.6ms)</text>
  </g>
  <g transform="translate(490, 201)">
    <rect width="235" height="54" rx="10" fill="#18181b" stroke="#10b981" stroke-width="1.5" />
    <circle cx="24" cy="27" r="5" fill="#34d399">
      <animate attributeName="opacity" values="1;0.3;1" dur="2.2s" repeatCount="indefinite" />
    </circle>
    <text x="40" y="31" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="12" font-weight="600">SSE Edge · FRA-1 (0.5ms)</text>
  </g>
</svg>
