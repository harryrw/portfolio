<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#10b981" stroke-opacity="0.12" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="800" height="320" fill="url(#bg)" />
  <rect width="800" height="320" fill="url(#grid)" />

  <!-- Glowing Ambient Orb -->
  <circle cx="400" cy="160" r="140" fill="#10b981" fill-opacity="0.12" />

  <!-- Node 1: Edge Ingestion -->
  <g transform="translate(70, 95)">
    <rect width="160" height="130" rx="14" fill="#18181b" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.6" />
    <circle cx="28" cy="30" r="6" fill="#34d399" />
    <text x="44" y="34" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="12" font-weight="700">INGEST EDGE</text>
    <rect x="22" y="54" width="116" height="8" rx="4" fill="#27272a" />
    <rect x="22" y="54" width="88" height="8" rx="4" fill="#10b981" />
    <rect x="22" y="72" width="116" height="8" rx="4" fill="#27272a" />
    <rect x="22" y="72" width="102" height="8" rx="4" fill="#34d399" />
    <text x="22" y="106" fill="#a1a1aa" font-family="ui-monospace, monospace" font-size="11">15,000+ ev/sec</text>
  </g>

  <!-- Animated Stream Connector 1 -->
  <path d="M 230 160 L 315 160" stroke="#10b981" stroke-width="2" stroke-dasharray="6 6">
    <animate attributeName="stroke-dashoffset" values="24;0" dur="1.5s" repeatCount="indefinite" />
  </path>
  <circle cx="272" cy="160" r="4" fill="#34d399">
    <animate attributeName="cx" values="235;310" dur="1.5s" repeatCount="indefinite" />
  </circle>

  <!-- Node 2: Partitioned WAL Log -->
  <g transform="translate(315, 75)">
    <rect width="170" height="170" rx="16" fill="#09090b" stroke="#34d399" stroke-width="2" />
    <text x="85" y="34" text-anchor="middle" fill="#34d399" font-family="ui-monospace, monospace" font-size="12" font-weight="700">APPEND-ONLY WAL</text>
    <rect x="24" y="52" width="122" height="22" rx="5" fill="#064e3b" stroke="#10b981" stroke-width="1" />
    <text x="34" y="67" fill="#d1fae5" font-family="ui-monospace, monospace" font-size="10">seq #004918 · sha256</text>
    <rect x="24" y="82" width="122" height="22" rx="5" fill="#064e3b" stroke="#10b981" stroke-width="1" />
    <text x="34" y="97" fill="#d1fae5" font-family="ui-monospace, monospace" font-size="10">seq #004919 · sha256</text>
    <rect x="24" y="112" width="122" height="22" rx="5" fill="#064e3b" stroke="#10b981" stroke-width="1" />
    <text x="34" y="127" fill="#d1fae5" font-family="ui-monospace, monospace" font-size="10">seq #004920 · sha256</text>
    <text x="85" y="154" text-anchor="middle" fill="#a1a1aa" font-family="ui-monospace, monospace" font-size="10">Deterministic Replay</text>
  </g>

  <!-- Animated Stream Connector 2 -->
  <path d="M 485 160 L 570 160" stroke="#10b981" stroke-width="2" stroke-dasharray="6 6">
    <animate attributeName="stroke-dashoffset" values="24;0" dur="1.5s" repeatCount="indefinite" />
  </path>
  <circle cx="528" cy="160" r="4" fill="#34d399">
    <animate attributeName="cx" values="490;565" dur="1.5s" repeatCount="indefinite" />
  </circle>

  <!-- Node 3: Read Projections -->
  <g transform="translate(570, 95)">
    <rect width="160" height="130" rx="14" fill="#18181b" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.6" />
    <circle cx="28" cy="30" r="6" fill="#10b981" />
    <text x="44" y="34" fill="#f4f4f5" font-family="ui-monospace, monospace" font-size="12" font-weight="700">PG PROJECTION</text>
    <text x="22" y="66" fill="#34d399" font-family="ui-monospace, monospace" font-size="20" font-weight="700">&lt; 50ms</text>
    <text x="22" y="88" fill="#d4d4d8" font-family="ui-monospace, monospace" font-size="11">Materialized Views</text>
    <text x="22" y="106" fill="#a1a1aa" font-family="ui-monospace, monospace" font-size="11">Rolling Snapshots</text>
  </g>
</svg>
