<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="100%" height="100%" fill="none">
  <defs>
    <!-- Deep space background gradient -->
    <linearGradient id="glBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913" />
      <stop offset="50%" stop-color="#0a1024" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Orange radial glow behind Half-Life icon -->
    <radialGradient id="hlGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.32" />
      <stop offset="70%" stop-color="#ea580c" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Left card background -->
    <linearGradient id="leftCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10172a" />
      <stop offset="50%" stop-color="#0c1220" />
      <stop offset="100%" stop-color="#080c16" />
    </linearGradient>

    <!-- Radar grid pattern -->
    <pattern id="glGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.18" />
    </pattern>
  </defs>

  <!-- Deep Canvas Base -->
  <rect width="800" height="320" fill="url(#glBgGrad)" />
  <rect width="800" height="320" fill="url(#glGrid)" />

  <!-- Stars in Background -->
  <g fill="#ffffff" opacity="0.35">
    <circle cx="50" cy="45" r="1" />
    <circle cx="150" cy="110" r="1.2" opacity="0.7" />
    <circle cx="270" cy="30" r="0.8" />
    <circle cx="430" cy="290" r="1.2" />
    <circle cx="610" cy="35" r="1" />
    <circle cx="750" cy="80" r="1.2" opacity="0.8" />
    <circle cx="780" cy="260" r="0.8" />
  </g>

  <!-- ============================================================
       TOP BROWSER BAR: World Wide Web SEARCH
       ============================================================ -->
  <g transform="translate(16, 10)">
    <rect width="768" height="30" rx="7" fill="#090e1c" stroke="#1e293b" stroke-width="1" />
    <!-- Window buttons -->
    <circle cx="15" cy="15" r="4" fill="#ef4444" opacity="0.85" />
    <circle cx="28" cy="15" r="4" fill="#f59e0b" opacity="0.85" />
    <circle cx="41" cy="15" r="4" fill="#10b981" opacity="0.85" />

    <!-- Web Search Bar -->
    <g transform="translate(62, 4)">
      <rect width="410" height="22" rx="4" fill="#050811" stroke="#334155" stroke-width="0.8" />
      <!-- Search Magnifier Icon -->
      <circle cx="12" cy="11" r="4" stroke="#f97316" stroke-width="1.2" />
      <line x1="15" y1="14" x2="19" y2="18" stroke="#f97316" stroke-width="1.2" />
      <text x="26" y="15" font-family="ui-monospace, monospace" font-size="10" font-weight="600" fill="#94a3b8">Search the World Wide Web: <tspan fill="#f8fafc">"Half-Life 3"</tspan></text>
    </g>

    <!-- Right Header Tag -->
    <g transform="translate(620, 4)">
      <rect width="150" height="22" rx="4" fill="#181310" stroke="#f97316" stroke-width="0.75" stroke-opacity="0.6" />
      <circle cx="14" cy="11" r="3.5" fill="#f97316" />
      <text x="25" y="15" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#fb923c" letter-spacing="0.5">WORLD WIDE WEB</text>
    </g>
  </g>

  <!-- ============================================================
       LEFT PANEL: GAME ART & HALF-LIFE 3 SPOTLIGHT
       ============================================================ -->
  <g transform="translate(16, 48)">
    <!-- Card Frame -->
    <rect width="338" height="260" rx="10" fill="url(#leftCardGrad)" stroke="#f97316" stroke-width="1.2" stroke-opacity="0.45" />

    <!-- Ambient glow behind Lambda -->
    <circle cx="169" cy="62" r="54" fill="url(#hlGlow)" />

    <!-- Classic Encircled Orange Lambda with "3" in Top Right -->
    <g transform="translate(169, 62)">
      <!-- Outer Orange Circle -->
      <circle cx="0" cy="0" r="32" fill="#0a0f1d" stroke="#f97316" stroke-width="3.5" />
      <circle cx="0" cy="0" r="28" fill="none" stroke="#ea580c" stroke-width="1" stroke-dasharray="3 3" opacity="0.6" />

      <!-- Classic Half-Life Lambda (λ) Vector Symbol -->
      <g stroke="#f97316" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <!-- Left Foot and Leg -->
        <path d="M -14 15 C -10 15 -6 9 -1 1" />
        <!-- Main Stem curving down from top-left to bottom-right -->
        <path d="M -4 -16 C -1 -7 5 5 14 15" />
        <!-- Top junction -->
        <path d="M -1 1 L 2 -6" />
      </g>

      <!-- The Number "3" in the Top Right of the Icon -->
      <g transform="translate(23, -23)">
        <circle cx="0" cy="0" r="12" fill="#ea580c" stroke="#f97316" stroke-width="1.5" />
        <text x="0" y="4.5" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="900" fill="#ffffff">3</text>
      </g>
    </g>

    <!-- G-Man Quote Below the Icon -->
    <text x="169" y="118" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-style="italic" fill="#cbd5e1" letter-spacing="0.4">“Rise and shine, Mr Freeman”</text>

    <!-- Game Title & Summary -->
    <g transform="translate(20, 136)">
      <rect x="0" y="0" width="138" height="18" rx="4" fill="#431407" stroke="#f97316" stroke-width="0.75" />
      <text x="8" y="12" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" fill="#fb923c" letter-spacing="1">PROJECT HLX · VALVE</text>
      
      <text x="0" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Half-Life 3 (Project HLX)</text>
      
      <text x="0" y="56" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Valve's unannounced single-player return to the</text>
      <text x="0" y="70" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Half-Life universe, in active development on Source 2.</text>

      <!-- Tag at bottom -->
      <g transform="translate(0, 84)">
        <rect width="298" height="24" rx="5" fill="#090e1c" stroke="#1e293b" stroke-width="0.75" />
        <text x="149" y="16" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" font-weight="600" fill="#38bdf8">VALVE SOFTWARE · SOURCE 2 ENGINE</text>
      </g>
    </g>
  </g>

  <!-- ============================================================
       RIGHT PANEL: LATEST TOPICS & SOURCES FROM THE WORLD WIDE WEB
       ============================================================ -->
  <g transform="translate(366, 48)">
    <!-- Section Header -->
    <g transform="translate(0, 0)">
      <text x="0" y="14" font-family="ui-monospace, monospace" font-size="10.5" font-weight="800" fill="#f8fafc" letter-spacing="1">WORLD WIDE WEB <tspan fill="#f97316">· LATEST TOPICS</tspan></text>
    </g>

    <!-- Topic Card 1: CS2 Engine Strings -->
    <g transform="translate(0, 24)">
      <rect width="418" height="70" rx="8" fill="#0d1322" stroke="#1e293b" stroke-width="1" />
      <!-- Source Badge -->
      <rect x="12" y="10" width="168" height="17" rx="4" fill="#431407" fill-opacity="0.4" stroke="#f97316" stroke-width="0.6" />
      <circle cx="20" cy="18.5" r="3" fill="#f97316" />
      <text x="28" y="22" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" fill="#fb923c">WORLD WIDE WEB · 4h ago</text>

      <!-- Topic Title & Snippet -->
      <text x="12" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#f8fafc">Source 2 strings leak "hlx_gravity_manipulator" and Xen fauna</text>
      <text x="12" y="58" font-family="system-ui, sans-serif" font-size="9.5" fill="#94a3b8">CS2 update files reference Xen gravity vortex physics and surface tension.</text>
    </g>

    <!-- Topic Card 2: Voice Actor Resume -->
    <g transform="translate(0, 104)">
      <rect width="418" height="70" rx="8" fill="#0d1322" stroke="#1e293b" stroke-width="1" />
      <!-- Source Badge -->
      <rect x="12" y="10" width="168" height="17" rx="4" fill="#431407" fill-opacity="0.4" stroke="#f97316" stroke-width="0.6" />
      <circle cx="20" cy="18.5" r="3" fill="#f97316" />
      <text x="28" y="22" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" fill="#fb923c">WORLD WIDE WEB · 1d ago</text>

      <!-- Topic Title & Snippet -->
      <text x="12" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#f8fafc">Voice actor Natasha Chandel resume lists Valve "Project White Sands"</text>
      <text x="12" y="58" font-family="system-ui, sans-serif" font-size="9.5" fill="#94a3b8">Resume details voice and motion capture sessions for unannounced Valve title.</text>
    </g>

    <!-- Topic Card 3: SteamDB Build Tracker -->
    <g transform="translate(0, 184)">
      <rect width="418" height="70" rx="8" fill="#0d1322" stroke="#1e293b" stroke-width="1" />
      <!-- Source Badge -->
      <rect x="12" y="10" width="168" height="17" rx="4" fill="#431407" fill-opacity="0.4" stroke="#f97316" stroke-width="0.6" />
      <circle cx="20" cy="18.5" r="3" fill="#f97316" />
      <text x="28" y="22" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" fill="#fb923c">WORLD WIDE WEB · 3d ago</text>

      <!-- Topic Title & Snippet -->
      <text x="12" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#f8fafc">Private SteamDB depot for Project HLX receives 42GB build update</text>
      <text x="12" y="58" font-family="system-ui, sans-serif" font-size="9.5" fill="#94a3b8">Staging depot updated with full asset packages and dual flatscreen/VR toggles.</text>
    </g>
  </g>
</svg>
