<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Deep space background gradient -->
    <linearGradient id="spaceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814" />
      <stop offset="50%" stop-color="#0b112c" />
      <stop offset="100%" stop-color="#070a1a" />
    </linearGradient>

    <!-- Radar / Nebula glow -->
    <radialGradient id="nebulaGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.18" />
      <stop offset="45%" stop-color="#6366f1" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Grid pattern -->
    <pattern id="spaceGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.25" />
    </pattern>
  </defs>

  <!-- Deep space canvas -->
  <rect width="800" height="450" fill="url(#spaceGrad)" />
  <rect width="800" height="450" fill="url(#nebulaGlow)" />
  <rect width="800" height="450" fill="url(#spaceGrid)" />

  <!-- Stars cluster -->
  <g fill="#ffffff" opacity="0.6">
    <circle cx="80" cy="60" r="1" />
    <circle cx="140" cy="120" r="1.5" opacity="0.8" />
    <circle cx="210" cy="40" r="1" />
    <circle cx="280" cy="90" r="1.2" />
    <circle cx="680" cy="80" r="1.5" opacity="0.9" />
    <circle cx="740" cy="160" r="1" />
    <circle cx="620" cy="220" r="1" />
    <circle cx="90" cy="360" r="1.2" />
    <circle cx="160" cy="400" r="1" />
    <circle cx="710" cy="380" r="1.5" />
  </g>

  <!-- Planet / Celestial horizon curve -->
  <ellipse cx="400" cy="560" rx="460" ry="200" fill="#090d21" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- Radar Scanning Rings (Telemetry Hub) -->
  <g transform="translate(400, 210)">
    <circle r="140" fill="none" stroke="#10b981" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="4 6" />
    <circle r="105" fill="none" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.3" />
    <circle r="70" fill="none" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.4" />
    <circle r="35" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5" stroke-dasharray="2 3" />

    <!-- Pulsing telemetry ring -->
    <circle r="70" fill="none" stroke="#34d399" stroke-width="2">
      <animate attributeName="r" values="35;140;35" dur="6s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.8;0;0.8" dur="6s" repeatCount="indefinite" />
    </circle>

    <!-- Crosshair coordinate lines -->
    <line x1="-155" y1="0" x2="155" y2="0" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.35" stroke-dasharray="3 3" />
    <line x1="0" y1="-155" x2="0" y2="155" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.35" stroke-dasharray="3 3" />

    <!-- Cosmonaut / Lander Module Icon in Center -->
    <g transform="translate(-20, -20)">
      <!-- Lander chassis -->
      <polygon points="10,8 30,8 36,26 4,26" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
      <!-- Helmet / Observation Dome -->
      <path d="M 14 8 A 6 6 0 0 1 26 8 Z" fill="#38bdf8" opacity="0.85" />
      <!-- Thruster base & legs -->
      <line x1="8" y1="26" x2="2" y2="36" stroke="#f59e0b" stroke-width="1.5" />
      <line x1="32" y1="26" x2="38" y2="36" stroke="#f59e0b" stroke-width="1.5" />
      <line x1="16" y1="26" x2="16" y2="33" stroke="#ef4444" stroke-width="2" />
      <line x1="24" y1="26" x2="24" y2="33" stroke="#ef4444" stroke-width="2" />
      <circle cx="20" cy="18" r="3" fill="#34d399" />
    </g>

    <!-- Source Node 1: Twitter / X Feed (Top Left) -->
    <g transform="translate(-160, -70)">
      <rect x="-45" y="-14" width="90" height="28" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
      <text x="0" y="4" text-anchor="middle" font-family="monospace" font-size="10" font-weight="600" fill="#38bdf8">X / TWITTER</text>
      <circle cx="45" cy="0" r="3" fill="#38bdf8" />
      <line x1="45" y1="0" x2="135" y2="55" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5" stroke-dasharray="3 3" />
    </g>

    <!-- Source Node 2: Bluesky Feed (Bottom Left) -->
    <g transform="translate(-160, 75)">
      <rect x="-40" y="-14" width="80" height="28" rx="6" fill="#0f172a" stroke="#0ea5e9" stroke-width="1" />
      <text x="0" y="4" text-anchor="middle" font-family="monospace" font-size="10" font-weight="600" fill="#0ea5e9">BLUESKY</text>
      <circle cx="40" cy="0" r="3" fill="#0ea5e9" />
      <line x1="40" y1="0" x2="135" y2="-55" stroke="#0ea5e9" stroke-width="1" stroke-opacity="0.5" stroke-dasharray="3 3" />
    </g>

    <!-- Source Node 3: r/GamingLeaksAndRumours (Right) -->
    <g transform="translate(175, 5)">
      <rect x="-45" y="-14" width="90" height="28" rx="6" fill="#0f172a" stroke="#f97316" stroke-width="1" />
      <text x="0" y="4" text-anchor="middle" font-family="monospace" font-size="10" font-weight="600" fill="#f97316">r/GL&amp;R SUB</text>
      <circle cx="-45" cy="0" r="3" fill="#f97316" />
      <line x1="-45" y1="0" x2="-135" y2="0" stroke="#f97316" stroke-width="1" stroke-opacity="0.5" stroke-dasharray="3 3" />
    </g>
  </g>

  <!-- Top UI HUD Bar -->
  <g transform="translate(40, 35)">
    <rect width="720" height="34" rx="8" fill="#0b112c" fill-opacity="0.8" stroke="#1e293b" stroke-width="1" />
    <circle cx="20" cy="17" r="4" fill="#10b981" />
    <text x="32" y="21" font-family="monospace" font-size="11" font-weight="700" fill="#e2e8f0" letter-spacing="1">GAMINGLANDR.COM</text>
    <text x="210" y="21" font-family="monospace" font-size="10" fill="#64748b">|</text>
    <text x="225" y="21" font-family="monospace" font-size="10" fill="#94a3b8">MISSION: LEAKS &amp; RUMORS RADAR</text>
    <rect x="580" y="8" width="125" height="18" rx="4" fill="#065f46" fill-opacity="0.4" stroke="#10b981" stroke-width="0.75" />
    <text x="642" y="20" text-anchor="middle" font-family="monospace" font-size="9" font-weight="600" fill="#34d399">TELEMETRY: ACTIVE</text>
  </g>

  <!-- Bottom Coordinates / Status Footer -->
  <g transform="translate(40, 420)" font-family="monospace" font-size="10" fill="#64748b">
    <text x="0" y="0">ORBIT: GEO-SYNC</text>
    <text x="200" y="0">SECTOR: MULTI-FEED INGESTION</text>
    <text x="560" y="0">COSMODROME: V1.0-ALPHA</text>
  </g>
</svg>