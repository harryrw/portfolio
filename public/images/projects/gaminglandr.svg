<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="100%" height="100%" fill="none">
  <defs>
    <!-- Dark deep-space background -->
    <linearGradient id="glBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913" />
      <stop offset="50%" stop-color="#0a1024" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Orange glow behind Half-Life icon -->
    <radialGradient id="hlGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.3" />
      <stop offset="70%" stop-color="#ea580c" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Hero card gradient -->
    <linearGradient id="heroCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#11182c" />
      <stop offset="50%" stop-color="#0d1322" />
      <stop offset="100%" stop-color="#080c16" />
    </linearGradient>

    <!-- Radar grid pattern -->
    <pattern id="glGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.18" />
    </pattern>
  </defs>

  <!-- Deep Canvas Base -->
  <rect width="800" height="320" fill="url(#glBgGrad)" />
  <rect width="800" height="320" fill="url(#glGrid)" />

  <!-- Stars in Background -->
  <g fill="#ffffff" opacity="0.4">
    <circle cx="60" cy="45" r="1" />
    <circle cx="160" cy="120" r="1.2" opacity="0.7" />
    <circle cx="280" cy="30" r="0.8" />
    <circle cx="450" cy="290" r="1.2" />
    <circle cx="620" cy="40" r="1" />
    <circle cx="760" cy="80" r="1.2" opacity="0.8" />
    <circle cx="780" cy="270" r="0.8" />
  </g>

  <!-- ============================================================
       TOP BROWSER / HUD HEADER BAR
       ============================================================ -->
  <g transform="translate(16, 10)">
    <rect width="768" height="28" rx="7" fill="#090e1c" stroke="#1e293b" stroke-width="1" />
    <!-- Window controls -->
    <circle cx="15" cy="14" r="4" fill="#ef4444" opacity="0.85" />
    <circle cx="28" cy="14" r="4" fill="#f59e0b" opacity="0.85" />
    <circle cx="41" cy="14" r="4" fill="#10b981" opacity="0.85" />

    <!-- Omnibar URL -->
    <g transform="translate(64, 4)">
      <rect width="320" height="20" rx="4" fill="#050811" stroke="#1e293b" stroke-width="0.75" />
      <path d="M 10 11 L 10 9 A 3 3 0 0 1 16 9 L 16 11 M 8 11 L 18 11 L 18 16 L 8 16 Z" stroke="#38bdf8" stroke-width="1" fill="none" />
      <text x="24" y="14" font-family="ui-monospace, monospace" font-size="10" font-weight="600" fill="#94a3b8">gaminglandr.com<tspan fill="#38bdf8">/radar</tspan><tspan fill="#f97316">/project-hlx</tspan></text>
    </g>

    <!-- Radar Sync Status -->
    <g transform="translate(574, 4)">
      <rect width="180" height="20" rx="4" fill="#042f2e" stroke="#10b981" stroke-width="0.75" />
      <circle cx="12" cy="10" r="3" fill="#34d399">
        <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite" />
      </circle>
      <text x="22" y="14" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#34d399" letter-spacing="1">RADAR: 3 SOURCES LIVE</text>
    </g>
  </g>

  <!-- ============================================================
       LEFT PANEL: FEATURED HALF-LIFE 3 (HLX) SHOWCASE
       ============================================================ -->
  <g transform="translate(16, 46)">
    <!-- Card Frame -->
    <rect width="362" height="262" rx="10" fill="url(#heroCardGrad)" stroke="#f97316" stroke-width="1.2" stroke-opacity="0.5" />

    <!-- Ambient glow behind Lambda -->
    <circle cx="181" cy="62" r="54" fill="url(#hlGlow)" />

    <!-- Classic Encircled Orange Lambda with "3" in Top Right -->
    <g transform="translate(181, 62)">
      <!-- Outer Orange Circle -->
      <circle cx="0" cy="0" r="32" fill="#0a0f1d" stroke="#f97316" stroke-width="3.5" />
      <circle cx="0" cy="0" r="28" fill="none" stroke="#ea580c" stroke-width="1" stroke-dasharray="3 3" opacity="0.6" />

      <!-- Classic Half-Life Lambda (λ) Vector Symbol -->
      <g stroke="#f97316" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <!-- Left Foot and Leg -->
        <path d="M -14 15 C -10 15 -6 9 -1 1" />
        <!-- Main Stem curving down from top-left to bottom-right -->
        <path d="M -4 -16 C -1 -7 5 5 14 15" />
        <!-- Top junction -->
        <path d="M -1 1 L 2 -6" />
      </g>

      <!-- The Number "3" in the Top Right of the Icon -->
      <g transform="translate(23, -23)">
        <circle cx="0" cy="0" r="12" fill="#ea580c" stroke="#f97316" stroke-width="1.5" />
        <text x="0" y="4.5" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="900" fill="#ffffff">3</text>
      </g>
    </g>

    <!-- G-Man Quote Below the Icon -->
    <text x="181" y="118" text-anchor="middle" font-family="Georgia, serif" font-size="13.5" font-style="italic" fill="#cbd5e1" letter-spacing="0.4">“Rise and shine, Mr Freeman”</text>

    <!-- Subtitle & Badge -->
    <g transform="translate(24, 134)">
      <rect x="0" y="0" width="136" height="18" rx="4" fill="#431407" stroke="#f97316" stroke-width="0.75" />
      <text x="8" y="12" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" fill="#fb923c" letter-spacing="1">PROJECT HLX · VALVE</text>
      
      <text x="0" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Half-Life 3 (Project HLX)</text>
      
      <text x="0" y="56" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Comprehensive single-player campaign in Source 2 with</text>
      <text x="0" y="70" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">HEV suit upgrades, dynamic gravity, and Xen physics.</text>

      <!-- Metric Pills -->
      <g transform="translate(0, 84)">
        <rect width="144" height="24" rx="5" fill="#090e1c" stroke="#1e293b" stroke-width="0.75" />
        <text x="72" y="16" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" font-weight="600" fill="#38bdf8">1,480+ HLX COMMITS</text>

        <rect x="154" y="0" width="160" height="24" rx="5" fill="#042f2e" stroke="#10b981" stroke-width="0.75" />
        <text x="234" y="16" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#34d399">96% VERACITY SCORE</text>
      </g>
    </g>
  </g>

  <!-- ============================================================
       RIGHT PANEL: REAL-TIME RUMORS & LEAKS FEED
       ============================================================ -->
  <g transform="translate(394, 46)">
    <!-- Feed Header Bar -->
    <g transform="translate(0, 0)">
      <text x="0" y="14" font-family="ui-monospace, monospace" font-size="10" font-weight="800" fill="#e2e8f0" letter-spacing="1">RADAR INTELLIGENCE FEED</text>
      <circle cx="195" cy="10" r="3" fill="#10b981">
        <animate attributeName="opacity" values="1;0.4;1" dur="1.2s" repeatCount="indefinite" />
      </circle>
      <text x="204" y="14" font-family="ui-monospace, monospace" font-size="9" font-weight="600" fill="#10b981">LIVE INGESTION</text>
    </g>

    <!-- Rumor Card 1: Bluesky Datamine (Tyler McVicker) -->
    <g transform="translate(0, 24)">
      <rect width="390" height="70" rx="8" fill="#0d1322" stroke="#1e293b" stroke-width="1" />
      <!-- Source Badge -->
      <rect x="12" y="10" width="94" height="17" rx="4" fill="#0369a1" fill-opacity="0.3" stroke="#38bdf8" stroke-width="0.6" />
      <text x="18" y="22" font-family="ui-monospace, monospace" font-size="8" font-weight="700" fill="#38bdf8">BLUESKY · @ValveData</text>

      <!-- Veracity Pill -->
      <rect x="296" y="10" width="82" height="17" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="0.6" />
      <text x="337" y="22" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8" font-weight="700" fill="#34d399">96% VERIFIED</text>

      <!-- Headline & Snippet -->
      <text x="12" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#f8fafc">Source 2 physics strings leak 'hlx_gravity_manipulator'</text>
      <text x="12" y="58" font-family="system-ui, sans-serif" font-size="9.5" fill="#94a3b8">Engine updates confirm Xen fauna &amp; dynamic voxel destructibility.</text>
    </g>

    <!-- Rumor Card 2: Reddit Voice Actor Leak -->
    <g transform="translate(0, 104)">
      <rect width="390" height="70" rx="8" fill="#0d1322" stroke="#1e293b" stroke-width="1" />
      <!-- Source Badge -->
      <rect x="12" y="10" width="88" height="17" rx="4" fill="#9a3412" fill-opacity="0.3" stroke="#f97316" stroke-width="0.6" />
      <text x="18" y="22" font-family="ui-monospace, monospace" font-size="8" font-weight="700" fill="#fb923c">REDDIT · r/GL&amp;R</text>

      <!-- Veracity Pill -->
      <rect x="296" y="10" width="82" height="17" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="0.6" />
      <text x="337" y="22" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8" font-weight="700" fill="#34d399">89% CREDIBLE</text>

      <!-- Headline & Snippet -->
      <text x="12" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#f8fafc">Voice actor resume confirms Valve "Project White Sands"</text>
      <text x="12" y="58" font-family="system-ui, sans-serif" font-size="9.5" fill="#94a3b8">Motion capture &amp; VO logs match internal Valve single-player codename.</text>
    </g>

    <!-- Rumor Card 3: SteamDB Build Tracker -->
    <g transform="translate(0, 184)">
      <rect width="390" height="70" rx="8" fill="#0d1322" stroke="#1e293b" stroke-width="1" />
      <!-- Source Badge -->
      <rect x="12" y="10" width="84" height="17" rx="4" fill="#1e1b4b" stroke="#818cf8" stroke-width="0.6" />
      <text x="18" y="22" font-family="ui-monospace, monospace" font-size="8" font-weight="700" fill="#a5b4fc">X · @SteamDB</text>

      <!-- Veracity Pill -->
      <rect x="296" y="10" width="82" height="17" rx="4" fill="#14532d" stroke="#22c55e" stroke-width="0.6" />
      <text x="337" y="22" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8" font-weight="700" fill="#4ade80">82% PROBABLE</text>

      <!-- Headline & Snippet -->
      <text x="12" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#f8fafc">Private Steam depot 'HLX' updated with 42GB staging build</text>
      <text x="12" y="58" font-family="system-ui, sans-serif" font-size="9.5" fill="#94a3b8">Depot activity points to closed internal playtests with SteamVR toggles.</text>
    </g>
  </g>
</svg>
