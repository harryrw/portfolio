<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <radialGradient id="nebula" cx="65%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35" />
      <stop offset="35%" stop-color="#ef4444" stop-opacity="0.22" />
      <stop offset="70%" stop-color="#3b82f6" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#09090b" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="rainbowBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="22%" stop-color="#f97316" />
      <stop offset="44%" stop-color="#eab308" />
      <stop offset="68%" stop-color="#10b981" />
      <stop offset="86%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="#09090b" />
  <rect width="800" height="450" fill="url(#nebula)" />

  <!-- Subtle Vinyl Grooves on Right -->
  <g transform="translate(560, 225)" opacity="0.45">
    <circle r="155" stroke="#27272a" stroke-width="1.5" />
    <circle r="135" stroke="#3f3f46" stroke-width="1" stroke-dasharray="14 6" />
    <circle r="115" stroke="#27272a" stroke-width="1.5" />
    <circle r="95" stroke="#3f3f46" stroke-width="1" />
    <circle r="75" stroke="#52525b" stroke-width="1" stroke-dasharray="8 4" />
    <circle r="44" fill="#18181b" stroke="url(#rainbowBar)" stroke-width="3" />
    <circle r="10" fill="#09090b" />
  </g>

  <!-- Iconic In Rainbows Stacked Spectrum Typography -->
  <g transform="translate(64, 88)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="800" letter-spacing="6">
    <text x="0" y="34" fill="#ef4444" font-size="34">IN RAINBOWS</text>
    <text x="0" y="76" fill="#f97316" font-size="34">IN_RAINBOWS</text>
    <text x="0" y="118" fill="#eab308" font-size="34">IN RAINBOWS</text>
    <text x="0" y="160" fill="#10b981" font-size="34">RADIOHEAD</text>
    <text x="0" y="202" fill="#38bdf8" font-size="34">IN_RAINBOWS</text>
    <rect x="0" y="226" width="320" height="6" rx="3" fill="url(#rainbowBar)" />
    <text x="0" y="262" fill="#e4e4e7" font-size="14" letter-spacing="3" font-weight="600">WEIRD FISHES / ARPEGGI · 2007</text>
  </g>
</svg>
